<div class="min-h-screen flex items-center">
    <div class="w-full max-w-xl mx-auto px-10">
        <form
            action=""
            [formGroup]="registerForm"
        >
            <legend class="text-center text-3xl font-ibm">Establece tú nueva contraseña</legend>
            <div class="flex flex-col gap-5 pt-5">
                <div class="relative flex flex-col">
                    <label class="ps-2">Contraseña</label>
                    <input type="password" class="border border-black rounded-md h-10 ps-2 focus:outline-none focus:border-orange-500" formControlName="password" id="password">
                    <div class="absolute right-3 top-1/2 text-orange-500 hover:text-black cursor-pointer" id="password_icono" (click)="showHidePassword('password')">
                        @if (passwordVisible) {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        } @else {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                        }
                    </div>
                </div>
                <div class="relative flex flex-col">
                    <label class="ps-2">Confirmar contraseña</label>
                    <input type="password" class="border border-black rounded-md h-10 ps-2 focus:outline-none focus:border-orange-500" formControlName="confirm_password" id="confirm_password">
                    <div class="absolute right-3 top-1/2 text-orange-500 hover:text-black cursor-pointer" id="confirm_password_" (click)="showHidePassword('confirm_password')">
                        @if (confirmPasswordVisible) {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        } @else {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                        }
                    </div>
                </div>
                <div class="flex justify-between">
                    <button (click)="this.fogotPasswordService.onSendResetPassword()" type="button" class="w-full bg-orange-500 hover:bg-orange-500/80 rounded-md py-2 text-white text-center">Siguiente</button>
                </div>
            </div>
        </form>
    </div>
</div>
