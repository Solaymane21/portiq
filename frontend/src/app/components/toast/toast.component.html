<div class="fixed bottom-20 right-6 z-50 flex flex-col gap-3 w-80 pointer-events-none">

  @for (toast of toasts(); track toast.id) {
    <div
      class="bg-neutral-950 relative overflow-hidden rounded-lg border shadow-lg pointer-events-auto
             flex items-start gap-3 p-4 animate-slide-in border-none"
      [ngClass]="{
        '  text-green-500': toast.type === 'success',
        '      text-red-500':     toast.type === 'error',
        '   text-orange-500':  toast.type === 'warning',
        '     text-blue-500':    toast.type === 'info'
      }">

      <!-- Icono -->
      <span class="shrink-0 mt-0.5">
        @if (toast.type === 'success') {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
            <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.06-1.06l-4.19 4.19-1.94-1.94a.75.75 0 0 0-1.06 1.06l2.5 2.5a.75.75 0 0 0 1.06 0l4.69-4.75Z" clip-rule="evenodd"/>
          </svg>
        }
        @if (toast.type === 'error') {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
            <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12ZM12 8.25a.75.75 0 0 1 .75.75v3.75a.75.75 0 0 1-1.5 0V9a.75.75 0 0 1 .75-.75Zm0 8.25a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z" clip-rule="evenodd"/>
          </svg>
        }
        @if (toast.type === 'warning') {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
            <path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003ZM12 8.25a.75.75 0 0 1 .75.75v3.75a.75.75 0 0 1-1.5 0V9a.75.75 0 0 1 .75-.75Zm0 8.25a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z" clip-rule="evenodd"/>
          </svg>
        }
        @if (toast.type === 'info') {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
            <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm8.706-1.442c1.146-.573 2.437.463 2.126 1.706l-.709 2.836.042-.02a.75.75 0 0 1 .67 1.34l-.04.022c-1.147.573-2.438-.463-2.127-1.706l.71-2.836-.042.02a.75.75 0 1 1-.671-1.34l.041-.022ZM12 9a.75.75 0 1 0 0-1.5A.75.75 0 0 0 12 9Z" clip-rule="evenodd"/>
          </svg>
        }
      </span>

      <!-- Mensaje -->
      <p class="text-sm flex-1 text-white/90 leading-snug">{{ toast.msg }}</p>

      <!-- Botón cerrar -->
      <button
        (click)="dismiss(toast.id)"
        class="shrink-0 opacity-50 hover:opacity-100 transition-opacity cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-4">
          <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/>
        </svg>
      </button>

      <!-- Barra de progreso -->
      <div
        class="toast-progress absolute bottom-0 left-0 h-0.5 w-full"
        [ngClass]="{
          'bg-green-500': toast.type === 'success',
          'bg-red-500':     toast.type === 'error',
          'bg-orange-500':  toast.type === 'warning',
          'bg-blue-500':    toast.type === 'info'
        }"
        [style.animation-duration]="(toast.duration ?? 5000) + 'ms'">
      </div>

    </div>
  }
</div>
