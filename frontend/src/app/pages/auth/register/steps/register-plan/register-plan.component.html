
    <div class="w-full max-w-xl mx-auto">
        <legend class="text-center text-3xl font-ibm">Elige tú plan de suscripción</legend>
        <div class="flex-col justify-center items-center gap-5 pt-5">
            <div class="flex flex-col sm:flex-row gap-5 w-full">
                <div class="flex flex-1 flex-col items-center justify-evenly gap-5 p-4 border border-orange-500 rounded-2xl">
                    <div class="font-ibm text-xl text-center">
                        <h2>Plan premium</h2>
                        <p>10€ / mes</p>
                    </div>
                    <div class="border-t border-orange-500 w-full"></div>
                    <div class="w-full">
                        <div class="flex flex-col justify-center items-center gap-2">
                            <div class="flex gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-orange-500">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg>
                                <p>Carteras ilimitadas</p>
                            </div>
                            <div class="flex gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-orange-500">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg>
                                <p>Sin límite de activos por cartera</p>
                            </div>
                        </div>
                        <button (click)="onPremiumPlan()" class="w-full text-white bg-orange-500 hover:bg-orange-500/80 rounded-md py-2 mt-4">Seleccionar</button>
                    </div>
                </div>
                <div class="flex flex-1 flex-col items-center justify-evenly gap-5 p-4 border border-black rounded-2xl mt-4">
                    <div class="font-ibm text-xl text-center">
                        <h2>Plan gratuito</h2>
                        <p>0€ / mes</p>
                    </div>
                    <div class="border-t border-black w-full"></div>
                    <div class="w-full">
                        <div class="flex flex-col justify-center items-center gap-2">
                            <div class="flex gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg>
                                <p>3 carteras</p>
                            </div>
                            <div class="flex gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg>
                                <p>Hasta 10 activos por cartera</p>
                            </div>
                        </div>
                        <button (click)="onFreePlan()" [disabled]="this.authService.isLoading()" class="w-full text-white bg-black hover:bg-black/80 flex justify-center rounded-md py-2 mt-4 disabled:cursor-not-allowed">
                            @if (this.authService.isLoading()) {
                              <mat-spinner diameter="20"></mat-spinner>
                            } @else {
                              Seleccionar
                            }
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
