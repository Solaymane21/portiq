<div class="border-t-8 border-orange-500" [style.width.%]="progressPercent()"></div>
<div class="flex flex-col justify-center items-center min-h-screen py-10 md:-mt-8">
    <div class="w-full px-10">
        @if(authService.currentStep() === 1) {
            <app-register-data></app-register-data>
        }
        @if(authService.currentStep() === 2) {
            <app-register-verification></app-register-verification>
        }
        @if(authService.currentStep() === 3) {
            <app-register-password></app-register-password>
        }
        @if(authService.currentStep() === 4) {
            <app-register-plan></app-register-plan>
        }

        <div class="flex justify-center gap-2 mt-5">
            <div class="w-3 h-3 bg-muted rounded-full" [class.bg-naranja-principal]="authService.currentStep() === 1"></div>
            <div class="w-3 h-3 bg-muted rounded-full" [class.bg-naranja-principal]="authService.currentStep() === 2"></div>
            <div class="w-3 h-3 bg-muted rounded-full" [class.bg-naranja-principal]="authService.currentStep() === 3"></div>
            <div class="w-3 h-3 bg-muted rounded-full" [class.bg-naranja-principal]="authService.currentStep() === 4"></div>
        </div>
    </div>
</div>
