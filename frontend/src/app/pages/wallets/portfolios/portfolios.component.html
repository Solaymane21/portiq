<div>
  
  <div class="flex justify-between">
    <h1 class="text-3xl font-ibm">Carteras</h1>
    
    <div class="flex items-center gap-3">
      <!-- Boton Vista Lista (Estilo "Activo" por defecto) -->
      <button 
        (click)="cambiarVista('list')" 
        class="p-2 rounded-md"
        [class]="viewMode() === 'list' ? 'bg-orange-500 hover:bg-orange-600' : 'bg-neutral-950 hover:text-orange-500'">
        <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" /></svg>
      </button>
      
      <!-- Boton Vista Grid (Estilo "Inactivo" por defecto) -->
      <button 
        (click)="cambiarVista('grid')" 
        class="p-2 rounded-md text-white"
        [class]="viewMode() === 'grid' ? 'bg-orange-500 hover:bg-orange-600' : 'bg-neutral-950 hover:text-orange-500'">
        <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" /></svg>
      </button>
      
      <!-- Boton Importar -->
      <button class="bg-white p-2 rounded-md text-black flex items-center gap-2">
        <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" /></svg>
        <span class="whitespace-nowrap">Importar CSV</span>
      </button>
      
      <!-- Boton Nueva Cartera -->
      <button (click)="abrirModal()" class="bg-orange-500 p-2 rounded-md text-white flex items-center gap-2">
        <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
        <span>Nueva Cartera</span>
      </button>
    </div>
  </div>

<!-- Modal Nueva Cartera -->
@if (isModalOpen()) {
  <div class="fixed inset-0 z-50 grid place-items-center bg-black/80">
    
    <div class="bg-neutral-950 border border-neutral-800 rounded-lg p-6 w-full max-w-sm">
      <h2 class="text-xl text-white font-medium mb-4">Nueva cartera</h2>
      
      <!-- Input de Texto --> 
      <input 
        [ngModel]="nombreCartera()" (ngModelChange)="nombreCartera.set($event)" 
        type="text" placeholder="Nombre de la cartera"
        class="w-full bg-neutral-900 border border-neutral-800 rounded px-4 py-2 mb-4 text-white outline-none focus:border-orange-500"
      >

      <!-- Checkboxes -->
      <div class="space-y-2 mb-6 text-white">
        <label class="flex items-center gap-3 cursor-pointer">
          <input [ngModel]="esDefault()" (ngModelChange)="esDefault.set($event)" type="checkbox" class="size-4 accent-orange-500">
          <span>Hacer cartera por defecto</span>
        </label>

        <label class="flex items-center gap-3 cursor-pointer">
          <input [ngModel]="esPublica()" (ngModelChange)="esPublica.set($event)" type="checkbox" class="size-4 accent-orange-500">
          <span>Hacer cartera pública</span>
        </label>
      </div>

      <!-- Botones -->
      <div class="flex justify-end gap-4">
        <button 
          (click)="cerrarModal()" 
          class="text-white px-4 py-2 rounded">
          Cancelar
        </button>
        
        <button 
          (click)="crearCartera()" 
          [disabled]="!nombreCartera().trim()" 
          class="bg-orange-500 text-white px-4 py-2 rounded disabled:opacity-50">
          Crear
        </button>
      </div>

    </div>
  </div>
}
  

</div>
