<div [class]="cardLayoutClass" class="bg-base p-4 rounded-xl border transition-colors cursor-pointer"
     [class.border-orange-500]="cartera.is_public"
     [class.border-neutral-800]="!cartera.is_public"
     [class.hover:border-neutral-700]="!cartera.is_public"
     (click)="open.emit(cartera.id)">
  
  <!-- Título y Public/Private -->
  <div class="flex flex-col gap-1 w-full sm:w-1/3">
    <h3 class="text-lg font-medium text-white truncate">{{ cartera.name }}</h3>
    
    <div class="flex items-center gap-1.5 text-xs">
      <ng-container *ngIf="cartera.is_public">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-3.5 text-orange-500">
          <path d="M18 1.5c2.9 0 5.25 2.35 5.25 5.25v3.75a.75.75 0 0 1-1.5 0V6.75a3.75 3.75 0 1 0-7.5 0v3a3 3 0 0 1 3 3v6.75a3 3 0 0 1-3 3H3.75a3 3 0 0 1-3-3v-6.75a3 3 0 0 1 3-3h9v-3c0-2.9 2.35-5.25 5.25-5.25Z" />
        </svg>
      </ng-container>
      <ng-container *ngIf="!cartera.is_public">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-3.5 text-orange-500">
          <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd" />
        </svg>
      </ng-container>
      <span class="text-neutral-400">
        {{ cartera.is_public ? 'Pública' : 'Privada' }}
      </span>
    </div>
  </div>

  <div class="flex flex-1 w-full justify-between items-center text-sm mt-2 sm:mt-0">
    <p class="text-neutral-400">
      {{ cartera.activos_count || 0 }} activo{{ cartera.activos_count !== 1 ? 's' : '' }}
    </p>
    <p class="text-white font-ibm font-medium text-lg">
      {{ cartera.valor_total || 0 | number:'1.0-0' }}€
    </p>
  </div>

  <!-- MENU TRES PUNTOS -->
  <div [class]="optionsContainerClass" (click)="$event.stopPropagation()">
    <button class="p-1.5 text-neutral-400 hover:text-white hover:bg-neutral-800 rounded-md transition-colors cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
        <path fill-rule="evenodd" d="M10.5 6a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Zm0 6a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Zm0 6a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Z" clip-rule="evenodd" />
      </svg>
    </button>

    <div class="absolute right-0 top-full pt-2 w-36 z-50 hidden group-hover:block">
      <div class="bg-neutral-900 border border-neutral-800 p-1 rounded-lg shadow-xl">
        <button (click)="edit.emit(cartera)" class="w-full flex items-center gap-2 text-left px-3 py-2 text-sm text-neutral-300 hover:bg-neutral-800 hover:text-white rounded-md transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4 text-neutral-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
          </svg>
          Editar
        </button>
        <div class="my-1 h-[1px] w-full bg-neutral-800"></div>
        <button (click)="delete.emit(cartera)" class="w-full flex items-center gap-2 text-left px-3 py-2 text-sm text-neutral-400 hover:bg-red-500/10 hover:text-red-400 rounded-md transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4 text-red-500/70">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
          </svg>
          Eliminar
        </button>
      </div>
    </div>
  </div>
</div>
