<div class="flex justify-between">
  <h1 class="text-3xl font-ibm">Dashboard</h1>
  <select
    class="bg-neutral-900 border border-neutral-700 rounded px-3 py-1"
    name="cartera"
    id="cartera"
  >
    <option value="1">Cartera 123</option>
  </select>
</div>

<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-5 mb-5">
  <div class="bg-neutral-900 border border-neutral-700 rounded-2xl p-5">
    <p class="text-sm text-neutral-400 mb-3">Valor total</p>
    <span class="text-base font-bold text-neutral-100">99.900€</span>
  </div>
  <div class="bg-neutral-900 border border-neutral-700 rounded-2xl p-5">
    <p class="text-sm text-neutral-400 mb-3">Valor total</p>
    <span class="text-base font-bold text-neutral-100">99.900€</span>
  </div>
  <div class="bg-neutral-900 border border-neutral-700 rounded-2xl p-5">
    <p class="text-sm text-neutral-400 mb-3">Valor total</p>
  </div>

  <div class="bg-neutral-900 border border-neutral-700 rounded-2xl p-5">
    <div class="relative donut-chart">
      <apx-chart
        [series]="donutOptions.series"
        [chart]="donutOptions.chart"
        [labels]="donutOptions.labels"
        [colors]="donutOptions.colors"
        [plotOptions]="donutOptions.plotOptions"
        [legend]="donutOptions.legend"
        [dataLabels]="donutOptions.dataLabels"
      >
      </apx-chart>

    </div>

    <div class="flex flex-col gap-2 mt-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-sm inline-block bg-orange-500"></span>
          <span class="text-xs text-neutral-400">Acciones</span>
          <span class="text-xs font-semibold text-[#EA580C]">70%</span>
        </div>
        
      </div>
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-sm inline-block bg-orange-800"></span>
          <span class="text-xs text-neutral-400">Cryptos</span>
          <span class="text-xs font-semibold text-neutral-400">30%</span>
        </div>
      </div>
    </div>
  </div>

</div>


<div class="grid grid-cols-5 gap-4">
  <div
    class="col-span-3 bg-neutral-900 border border-neutral-700 rounded-2xl p-5 flex flex-col"
  >
    <div class="flex justify-end gap-1 mb-2">
      @for (p of periods; track p) {
        <button
          (click)="setPeriod(p)"
          class="px-2.5 py-0.5 rounded-md text-xs font-semibold transition-colors"
          [class.bg-orange-600]="p === selectedPeriod"
          [class.text-white]="p === selectedPeriod"
          [class.text-neutral-400]="p !== selectedPeriod"
        >
          {{ p }}
        </button>
      }
    </div>

    @if (isLoading) {
      <div class="flex-1 flex items-center justify-center">
        <div
          class="w-6 h-6 border-2 border-orange-800 border-t-transparent rounded-full animate-spin"
        ></div>
      </div>
    } @else if (areaOptions) {
        <apx-chart
          [series]="areaOptions.series"
          [chart]="areaOptions.chart"
          [colors]="areaOptions.colors"
          [stroke]="areaOptions.stroke"
          [fill]="areaOptions.fill"
          [grid]="areaOptions.grid"
          [xaxis]="areaOptions.xaxis"
          [yaxis]="areaOptions.yaxis"
          [tooltip]="areaOptions.tooltip"
          [dataLabels]="areaOptions.dataLabels"
          [markers]="areaOptions.markers"
        >
        </apx-chart>
    }
  </div>

  <div class = "col-span-2 bg-neutral-900 border border-neutral-700 rounded-2xl p-5">
    <p class="text-sm text-neutral-400 mb-3">Mis posiciones</p>
    <div class="flex flex-col divide-y divide-neutral-800">
      <div class="flex items-center justify-between py-2.5">
        <div class="flex items-center gap-3">
          <span class="text-sm font-semibold text-neutral-100">AAPL</span>
          <span class="text-xs text-neutral-500">Apple Inc.</span>
        </div>
        <div class="text-right">
          <p class="text-sm font-semibold text-neutral-100">$182.50</p>
          <p class="text-xs text-emerald-500">+1.24%</p>
        </div>
      </div>
    </div>
  </div>



</div>
