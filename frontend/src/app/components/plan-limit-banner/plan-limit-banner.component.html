@if (showBanner()) {

    <svg
      class="size-5 shrink-0 text-red-500"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
    </svg>
    <p class="flex-1 text-zinc-900 dark:text-neutral-100">
      Has alcanzado el límite de {{ limitText() }} del plan gratuito.
    </p>
    <a
      routerLink="/app/settings"
      fragment="subscription"
      class="px-3 py-1 bg-red-500 hover:bg-red-500/80 text-white rounded-md whitespace-nowrap cursor-pointer">
      Hazte Pro
    </a>
  </div>
}
