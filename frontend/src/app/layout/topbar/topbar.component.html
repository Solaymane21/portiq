<nav class="w-full bg-neutral-950 border-b border-neutral-600">
    <div class="flex justify-end md:justify-between items-center h-16 mx-14">
        <div class="hidden md:block relative flex-1 max-w-xs">
            <input class="w-full bg-neutral-800 outline-none focus:outline-neutral-600 rounded-full px-3 py-1 text-neutral-300 placeholder:text-neutral-300" type="text"
                placeholder="Busca una acción o crypto...">
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-300 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
                    <path fill-rule="evenodd"
                        d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z"
                        clip-rule="evenodd" />
                </svg>
            </span>
        </div>
        <div class="flex flex-row items-center gap-5">
            <div>
                @if (user()?.suscription_type === 'premium') {
                    <span class="badge-premium rounded-full py-1 px-3 border border-orange-500">
                        <span class="font-ibm text font-extrabold ">Pro</span>
                    </span>
                }
                @else {
                    <a routerLink="/app/settings" fragment="subscription" class="text hover:underline hover:cursor-pointer">¿Hacerse Pro?</a>
                }
            </div>
            <div class="bg-neutral-800 p-2 rounded text-neutral-300 hover:cursor-pointer hover:opacity-90">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 ">
                    <path fill-rule="evenodd"
                        d="M5.25 9a6.75 6.75 0 0 1 13.5 0v.75c0 2.123.8 4.057 2.118 5.52a.75.75 0 0 1-.297 1.206c-1.544.57-3.16.99-4.831 1.243a3.75 3.75 0 1 1-7.48 0 24.585 24.585 0 0 1-4.831-1.244.75.75 0 0 1-.298-1.205A8.217 8.217 0 0 0 5.25 9.75V9Zm4.502 8.9a2.25 2.25 0 1 0 4.496 0 25.057 25.057 0 0 1-4.496 0Z"
                        clip-rule="evenodd" />
                </svg>
            </div>
            <div class="w-10 h-10 rounded-full overflow-hidden">
                <img src="{{ avatar }}" alt="Avatar del usuario"
                    class="w-full h-full object-cover"
                    referrerpolicy="no-referrer">
            </div>
        </div>
    </div>
</nav>
