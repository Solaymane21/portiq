version: '3.9'

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portiq_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - portiq_vendor:/var/www/html/vendor
    environment:
      APP_NAME: PortIQ
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: require
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: ${MAIL_USERNAME}
      MAIL_FROM_NAME: PortIQ
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: http://localhost:8000/api/auth/google/callback
      FRONTEND_URL: http://localhost:4200
    networks:
      - portiq_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portiq_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - portiq_node_modules:/app/node_modules
    networks:
      - portiq_network

  ml:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: portiq_ml
    ports:
      - "8001:8001"
    volumes:
      - ./ml-service:/app
    networks:
      - portiq_network

networks:
  portiq_network:
    driver: bridge

volumes:
  portiq_vendor:
  portiq_node_modules: