<!-- ENCABEZADO -->
<div class="mx-12 mb-6 flex justify-between items-center">
  <div class="flex items-center gap-4">
    <a routerLink="/app/portfolios" class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-base border border-neutral-800 hover:bg-neutral-800 transition-colors text-neutral-400 hover:text-white cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </a>
    <h1 class="text-3xl font-ibm text-white">
      @if (cargando()) { Cargando... } @else { {{ nombreCartera() }} }
    </h1>
  </div>

  <div class="flex items-center gap-3">
    <!-- BOTÓN EXPORTAR CSV -->
    <button class="bg-white p-2 rounded-md text-black flex items-center gap-2 hover:bg-neutral-200 transition-colors cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
      </svg>
      <p class="whitespace-nowrap">Exportar CSV</p>
    </button>

    <!-- BOTÓN NUEVA POSICIÓN -->
    <button (click)="abrirModalNuevaPosicion()" class="bg-orange-500 p-2 rounded-md flex items-center gap-2 hover:bg-orange-600 transition-colors cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      <span>Nueva Posición</span>
    </button>
  </div>
</div>

<!-- TARJETAS ESTADÍSTICAS -->
<app-portfolio-stats
  [cargando]="cargando()"
  [valorTotal]="valorTotal()"
  [ganancias]="ganancias()"
  [porcentajeGanancias]="porcentajeGanancias()"
  [totalPosiciones]="totalPosiciones()">
</app-portfolio-stats>

<!-- TABLA MAT-TABLE (LLAMADA AL COMPONENTE HIJO, SIN HTML REPETIDO AQUÍ) -->
<app-portfolio-activos-table
  [activosData]="activosData()"
  [cargando]="cargando()"
  (comprar)="abrirModalTransaccion($event, 'buy')"
  (vender)="abrirModalTransaccion($event, 'sell')">
</app-portfolio-activos-table>

<!-- MODAL DE TRANSACCIONES -->
@if (mostrarModal()) {
  <app-portfolio-transaction-modal
    [carteraId]="carteraId!"
    [activoInicial]="activoParaTransaccion()"
    [tipoInicial]="tipoTransaccion()"
    (cerrar)="mostrarModal.set(false)"
    (guardado)="cargarInversiones()">
  </app-portfolio-transaction-modal>
}
