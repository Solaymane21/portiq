<div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
  <div class="bg-base rounded-xl shadow-2xl border border-red-900/30 w-full max-w-md p-6">
    <div class="w-12 h-12 rounded-full bg-red-500/10 flex items-center justify-center mb-4 text-red-500">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3Z" />
      </svg>
    </div>
    
    <h2 class="text-xl font-bold text-white mb-2">Eliminar cartera</h2>
    
    <p class="text-sm text-neutral-400 mb-6">
      Esta acción no se puede deshacer. Se eliminarán permanentemente todos los activos asociados a esta cartera.<br><br>
      Por favor, escribe <strong class="text-white">{{ cartera.name }}</strong> para confirmar.
    </p>

    <div class="mb-6">
      <input type="text" 
             [ngModel]="nombreConfirmacionEliminar()" 
             (ngModelChange)="nombreConfirmacionEliminar.set($event)"
             class="w-full bg-neutral-900 text-white border border-neutral-800 rounded-lg p-2.5 focus:outline-none focus:border-red-500 transition-colors"
             [placeholder]="cartera.name">
    </div>

    <div class="flex justify-end gap-3">
      <button (click)="cerrar.emit()" class="px-4 py-2 text-sm font-medium text-neutral-400 hover:text-white hover:bg-neutral-800 rounded-lg transition-colors">
        Cancelar
      </button>
      <button (click)="confirmarEliminar()" 
              [disabled]="nombreConfirmacionEliminar() !== cartera.name"
              class="px-5 py-2 text-sm font-medium bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        Eliminar
      </button>
    </div>
  </div>
</div>
