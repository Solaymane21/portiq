<div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
  <div class="bg-base rounded-xl shadow-2xl border border-neutral-800 w-full max-w-md p-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-white">
        {{ esModoEdicion ? 'Editar Cartera' : 'Nueva Cartera' }}
      </h2>
      <button (click)="cerrar.emit()" class="text-neutral-500 hover:text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form (ngSubmit)="guardarFormulario()">
      <div class="mb-4">
        <label class="block text-sm text-neutral-400 mb-1.5">Nombre de la cartera</label>
        <input type="text" 
               [ngModel]="formulario().name" 
               (ngModelChange)="actualizarNombre($event)" 
               name="name" 
               required
               class="w-full bg-neutral-900 text-white border border-neutral-800 rounded-lg p-2.5 focus:outline-none focus:border-orange-500 transition-colors placeholder:text-neutral-600">
      </div>

      <div class="mb-8">
        <label class="block text-sm text-neutral-400 mb-2">Visibilidad</label>
        <div class="flex items-center bg-neutral-900 border border-neutral-800 rounded-lg p-1 gap-1 w-full">
          <button type="button" 
                  (click)="actualizarIsPublic(false)"
                  [ngClass]="!formulario().is_public ? 'bg-neutral-700 text-white shadow-sm' : 'text-neutral-500 hover:text-neutral-300'"
                  class="flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all duration-200 cursor-pointer">
            Privada
          </button>
          
          <button type="button" 
                  (click)="actualizarIsPublic(true)"
                  [ngClass]="formulario().is_public ? 'bg-orange-500 text-white shadow-sm' : 'text-neutral-500 hover:text-neutral-300'"
                  class="flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all duration-200 cursor-pointer">
            Pública
          </button>
        </div>
        <p class="text-xs text-neutral-500 mt-2">
          <ng-container *ngIf="formulario().is_public; else textoPrivado">
            Otros usuarios podrán ver tus posiciones, pero no las cantidades exactas.
          </ng-container>
          <ng-template #textoPrivado>
            Solo tú puedes ver esta cartera.
          </ng-template>
        </p>
      </div>

      <div class="flex justify-end gap-3">
        <button type="button" (click)="cerrar.emit()" class="px-4 py-2 text-sm font-medium text-neutral-400 hover:text-white hover:bg-neutral-800 rounded-lg transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="!formulario().name" class="px-5 py-2 text-sm font-medium bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          {{ esModoEdicion ? 'Guardar Cambios' : 'Crear Cartera' }}
        </button>
      </div>
    </form>
  </div>
</div>
