<div class="min-h-screen flex items-center">
    <div class="w-full max-w-xl mx-auto px-10">
        <form
            action=""
            [formGroup]="registerForm"
        >
        @if(this.fogotPasswordService.currentStep() === 'email') {
            <legend class="text-center text-3xl font-ibm">¿Has olvidado tú contraseña?</legend>
            <div class="flex flex-col gap-5 pt-5">
                <div class="text-center flex flex-col gap-3">
                    <p>Introduce el <b>correo electrónico</b> associado a tú cuenta de PortIQ</p>
                </div>
                <div class="flex flex-col">
                    <label class="ps-2">Email</label>
                    <input type="text" class="border border-black rounded-md h-10 ps-2 focus:outline-none focus:border-orange-500" formControlName="email">
                </div>
                <div class="flex justify-between">
                    <button (click)="this.fogotPasswordService.onBack()" class="flex items-center w-fit hover:cursor-pointer"><span class="hover:underline">Volver</span></button>
                    <button (click)="this.fogotPasswordService.onSendEmail()" type="button" class="w-1/2 bg-orange-500 hover:bg-orange-500/80 rounded-md py-2 text-white text-center">Siguiente</button>
                </div>
            </div>
        }
        @else {
            <legend class="text-center text-3xl font-ibm">Verifica tú email</legend>
            <div class="flex flex-col gap-5 pt-5">
                <div class="text-center flex flex-col gap-3">
                    <p>Introduce el código de verificación enviado al correo electrónico <b>abc***&#64;gmail.com</b></p>
                    <p>¿No has recibido el código? <button (click)="this.fogotPasswordService.onResendCode()" class="text-orange-500 hover:underline hover:cursor-pointer">Reenviar código</button></p>
                </div>
                <div class="flex flex-col">
                    <label class="ps-2">Código</label>
                    <input type="text" class="border border-black rounded-md h-10 ps-2 focus:outline-none focus:border-orange-500" formControlName="email">
                </div>
                <div class="flex justify-between">
                    <button (click)="this.fogotPasswordService.onBack()" class="flex items-center w-fit hover:cursor-pointer"><span class="hover:underline">Volver</span></button>
                    <button (click)="this.fogotPasswordService.onSendCode()" type="button" class="w-1/2 bg-orange-500 hover:bg-orange-500/80 rounded-md py-2 text-white text-center">Confirmar código</button>
                </div>
            </div>
        }
        </form>
    </div>    
</div>
