<div class="flex h-screen items-center justify-center">
    <div class="bg-naranja-principa w-9/12 md:w-6/12 lg:w-5/12 h-fit font-ibm">
        <form
            action=""
            [formGroup]="registerForm"
            (ngSubmit)="onSubmit()"
        >
            <legend class="text-center text-3xl">Regístrate</legend>
            <div class="flex flex-col gap-5 pt-2">
                <div class="flex flex-col">
                    <label class="ps-2">Nombre de usuario</label>
                    <input type="text" class="border border-interactivo rounded-md h-10 ps-2" formControlName="username">
                </div>
                <div class="flex flex-col">
                    <label class="ps-2">Email</label>
                    <input type="email" class="border border-interactivo rounded-md h-10 ps-2" formControlName="email">
                </div>
                <div class="relative flex flex-col">
                    <label class="ps-2">Contraseña</label>
                    <input type="password" class="border border-interactivo rounded-md h-10 ps-2" formControlName="password" id="password">
                    <div class="absolute right-3 top-1/2 text-naranja-principal hover:text-interactivo cursor-pointer" id="password_icono" (click)="showHidePassword('password')">
                        @if (passwordVisible) {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        } @else {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                        }
                    </div>
                </div>
                <div class="relative flex flex-col">
                    <label class="ps-2">Confirmar contraseña</label>
                    <input type="password" class="border border-interactivo rounded-md h-10 ps-2" formControlName="confirm_password" id="confirm_password">
                    <div class="absolute right-3 top-1/2 text-naranja-principal hover:text-interactivo cursor-pointer" id="confirm_password_" (click)="showHidePassword('confirm_password')">
                        @if (confirmPasswordVisible) {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        } @else {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                        }
                    </div>
                </div>
                <button type="submit" class="bg-naranja-principal rounded-md py-2 text-white">Siguiente</button>
                <div class="border-t border-interactivo w-full"></div>
                <div class="flex flex-col">                    
                    <button type="button" class="w-full flex items-center justify-center gap-2 py-2 border border-interactivo bg-white rounded-md">
                    <svg class="h-5 w-5 flex-shrink-0" viewBox="0 0 24 24">
                        <path
                        fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        />
                        <path
                        fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        />
                        <path
                        fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        />
                        <path
                        fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        />
                    </svg>
                    Continuar con Google
                    </button>
                </div>
                <div class="text-center">
                    <p>¿Ya tienes cuenta? <span> <a routerLink="/auth/login" class="text-naranja-principal hover:underline">Inicia sesion</a></span></p>
                </div>
                <div class="flex justify-center gap-2">
                    <div class="w-3 h-3 bg-naranja-principal rounded-full"></div>
                    <div class="w-3 h-3 bg-muted rounded-full"></div>
                </div>
            </div>
        </form>
    </div>
</div>
