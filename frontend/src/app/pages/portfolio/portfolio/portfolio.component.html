<div class="flex justify-between">
  <!-- HEADER Y BOTONES -->
  <h1 class="text-3xl font-ibm">Carteras</h1>

  <div class="flex items-center gap-3">
    <button (click)="viewMode.set('list')" [class]="btnListClass()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
      </svg>
    </button>
    <button (click)="viewMode.set('grid')" [class]="btnGridClass()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
      </svg>
    </button>

    <button class="bg-white p-2 rounded-md text-black flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
      </svg>
      <p class="whitespace-nowrap">Importar CSV</p>
    </button>

    <button (click)="abrirModalCrear()" class="bg-orange-500 p-2 rounded-md flex items-center gap-2 hover:bg-orange-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      <span>Nueva Cartera</span>
    </button>
  </div>
</div>

<!-- ESTADO DE CARGA -->
@if (cargando()) {
  <div class="col-span-full py-16 mt-4 flex flex-col items-center justify-center text-neutral-500 bg-base rounded-xl border border-neutral-800">
    <svg class="animate-spin h-10 w-10 text-orange-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <p>Cargando carteras...</p>
  </div>
} @else {
  <!-- LISTA DE CARTERAS -->
  <div [class]="containerClass()" class="mt-4">
    @for (cartera of listaCarteras(); track cartera.id) {
      <app-portfolio-card 
        [cartera]="cartera"
        [cardLayoutClass]="cardLayoutClass()"
        [optionsContainerClass]="optionsContainerClass()"
        (open)="irAlDetalle($event)"
        (edit)="abrirModalEditar($event)"
        (delete)="abrirModalEliminar($event)">
      </app-portfolio-card>
    } @empty {
      <div class="col-span-full py-16 text-center text-neutral-500 bg-base rounded-xl border border-neutral-800 border-dashed">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-12 mx-auto mb-3 opacity-20">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <p>No tienes ninguna cartera aún. ¡Crea la primera!</p>
      </div>
    }
  </div>
}

<!-- MODALES -->
<app-portfolio-form-modal 
  *ngIf="mostrarModal()"
  [esModoEdicion]="esModoEdicion()"
  [initialData]="formulario()"
  (cerrar)="cerrarModal()"
  (guardar)="guardarFormulario($event)">
</app-portfolio-form-modal>

<app-portfolio-delete-modal 
  *ngIf="mostrarModalEliminar()"
  [cartera]="carteraAEliminar()!"
  (cerrar)="cerrarModalEliminar()"
  (confirmar)="confirmarEliminar($event)">
</app-portfolio-delete-modal>
